<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#22355a"/>
      <stop offset="0.6" stop-color="#121c33"/>
      <stop offset="1" stop-color="#080d1a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#e8b94a"/>
      <stop offset="1" stop-color="#9a6a1c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4f86"/>
      <stop offset="1" stop-color="#16294d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="400" height="400" rx="64" fill="url(#bg)"/>
  <rect x="10" y="10" width="380" height="380" rx="56" fill="none" stroke="#3a5487" stroke-opacity="0.5" stroke-width="2"/>

  <!-- band gauge: Unknown / Building / Solid / Exemplary (the addon's bands) -->
  <g fill="none" stroke-width="20" stroke-linecap="round" filter="url(#glow)">
    <path d="M 66 280 A 150 150 0 0 1 82 132" stroke="#9a9a9a"/>
    <path d="M 102 106 A 150 150 0 0 1 184 61" stroke="#f2d95a"/>
    <path d="M 216 61 A 150 150 0 0 1 298 106" stroke="#5ad967"/>
    <path d="M 318 132 A 150 150 0 0 1 334 280" stroke="#66bfff"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M200 108 L284 138 C284 222 254 286 200 320 C146 286 116 222 116 138 Z" fill="url(#gold)"/>
    <path d="M200 122 L271 147 C270 219 245 274 200 304 C155 274 130 219 129 147 Z" fill="url(#shield)"/>
  </g>

  <!-- verified check -->
  <path d="M158 212 L188 242 L246 176" fill="none" stroke="#0b1428" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(0,4)"/>
  <path d="M158 212 L188 242 L246 176" fill="none" stroke="url(#gold)" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Exemplary star -->
  <path d="M200 38 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 z" fill="#fff1b8" filter="url(#glow)"/>
</svg>
