<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Forever Relationships: two players, one endless loop. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#22355a"/>
      <stop offset="0.6" stop-color="#121c33"/>
      <stop offset="1" stop-color="#080d1a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#e8b94a"/>
      <stop offset="1" stop-color="#9a6a1c"/>
    </linearGradient>
    <radialGradient id="blue" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#3d8be0"/>
    </radialGradient>
    <radialGradient id="warm" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#e8964a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="64" fill="url(#bg)"/>
  <rect x="10" y="10" width="380" height="380" rx="56" fill="none" stroke="#3a5487" stroke-opacity="0.5" stroke-width="2"/>

  <!-- the loop: drawn as two halves so the crossing reads over/under -->
  <g fill="none" stroke-linecap="round" filter="url(#shadow)">
    <path d="M200,200 C160,140 72,132 72,200 C72,268 160,260 200,200" stroke="url(#gold)" stroke-width="26" filter="url(#glow)"/>
    <path d="M200,200 C240,140 328,132 328,200 C328,268 240,260 200,200" stroke="#121c33" stroke-width="40"/>
    <path d="M200,200 C240,140 328,132 328,200 C328,268 240,260 200,200" stroke="url(#gold)" stroke-width="26" filter="url(#glow)"/>
  </g>

  <!-- two players -->
  <circle cx="128" cy="200" r="22" fill="url(#blue)" filter="url(#glow)"/>
  <circle cx="272" cy="200" r="22" fill="url(#warm)" filter="url(#glow)"/>

  <!-- spark of a shared moment -->
  <path d="M200,92 l7,17 17,7 -17,7 -7,17 -7,-17 -17,-7 17,-7z" fill="#fff1b8" filter="url(#glow)"/>
</svg>
