name: Companion app

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: ForeverRelationshipsCompanion.exe
            asset: ForeverRelationshipsCompanion-windows.exe
          - os: macos-latest
            exe: ForeverRelationshipsCompanion
            asset: ForeverRelationshipsCompanion-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: companion
        run: |
          python -m pip install -r ../server/requirements.txt
          python -m unittest discover -s tests -v
      - name: Server tests
        working-directory: server
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build single-file executable
        working-directory: companion
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --name ForeverRelationshipsCompanion fr_companion.py
      - name: Smoke test
        working-directory: companion
        shell: bash
        run: ./dist/${{ matrix.exe }} --version
      - name: Rename
        shell: bash
        run: cp companion/dist/${{ matrix.exe }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/companion-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the macOS build here is a test build only: the signed + notarized one is
          # attached from a Mac with companion/release-mac.sh
          gh release create "$GITHUB_REF_NAME" assets/ForeverRelationshipsCompanion-windows.exe companion/fr_companion.py \
            --title "Forever Relationships Companion ${GITHUB_REF_NAME#companion-v}" \
            --notes-file companion/RELEASE_NOTES.md
